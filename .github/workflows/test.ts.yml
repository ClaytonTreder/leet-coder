name: Run Tests
on: [push] # Triggers tests automatically

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Pulls your code
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: ./typescript # Changes to the frontend folder

      - name: Run tests in subfolder
        run: npm test
        working-directory: ./typescript # Changes to the frontend folder
