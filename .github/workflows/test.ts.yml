name: Run Tests

on:
  push:
    branches: [ solutions/ClaytonTreder ]

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your specific version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # continue-on-error ensures the badge updates even if tests fail
      - name: Run Test Suite
        run: npm test
        continue-on-error: true 

      # Pass your repository secrets into the script environment
      - name: Parse and Update Gist
        run: node generate-badge.js
        env:
          GIST_ID: gist:af4877d519a5dd3b94cbee51330ed088
          GIST_TOKEN: ${{ secrets.CLAYTON_TREDER_GIST }}
